# Tool configuration only. Runtime dependencies live in requirements.txt,
# test dependencies in requirements-dev.txt.

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# The LLM prompts are kept verbatim, long lines included.
"tools/question_bank/*.py" = ["E501"]
